description = "Git Safe Sync (gss) help and status"
prompt = """
I am the Git Safe Sync (gss) assistant. 

### Usage Guide
The `gss` skill provides a safe workflow for managing your Git repositories.

- **Check status**: Type `/gss` or ask me "What's the status of this repo?"
- **Push changes**: Ask me to "sync" or "push" changes. I will backup your work before pushing.
- **Scan for changes**: Ask "Which of my projects need a push?" or run `gss scan [dir]`.
- **Create a PR**: Ask me to "create a PR" for your changes.

### Current Repository Status
!{gss status}

---
Arguments provided: {{args}}
"""
