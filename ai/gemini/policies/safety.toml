[[rule]]
toolName = "run_shell_command"
# Blocks 'rm -rf *', 'rm -rf ./*', 'rm -rf  *', etc.
commandRegex = "rm\\s+.*-rf.*\\*"
decision = "deny"
priority = 1000
denyMessage = "Recursive wildcard deletion (rm -rf *) is strictly prohibited by safety policy."

[[rule]]
toolName = "run_shell_command"
# Blocks 'rm -rf .' (current directory)
commandRegex = "rm\\s+.*-rf.*\\s+\\."
decision = "deny"
priority = 1000
denyMessage = "Recursive deletion of the current directory (rm -rf .) is prohibited."

[[rule]]
toolName = "run_shell_command"
# Protects the root directory specifically
commandPrefix = "rm -rf /"
decision = "deny"
priority = 1000
denyMessage = "Deletion of the root directory is strictly prohibited."

[[rule]]
toolName = "run_shell_command"
# Protects common system directories from deletion
commandRegex = "rm\\s+.*-rf.*\\s+/(etc|usr|bin|var|boot|root)"
decision = "deny"
priority = 1000
denyMessage = "Attempted deletion of a protected system directory."

[[rule]]
toolName = "run_shell_command"
# Prevent raw disk wiping/writing
commandPrefix = ["dd", "mkfs", "fdisk", "parted", "sfdisk", "mkswap"]
decision = "deny"
priority = 1000
denyMessage = "Disk management and raw writing commands are restricted for safety."

[[rule]]
toolName = "run_shell_command"
# Prevent permission/ownership nuking of the root system
commandRegex = "(chmod|chown)\\s+.*-R.*\\s+/"
decision = "deny"
priority = 1000
denyMessage = "Recursive permission or ownership changes on the root filesystem are prohibited."

[[rule]]
toolName = "run_shell_command"
# Prevent fork bombs
commandRegex = ":\\(\\)\\{\\s*:\\|:&\\s*\\};:"
decision = "deny"
priority = 1000
denyMessage = "Detected a fork bomb pattern. Command blocked."

[[rule]]
toolName = "run_shell_command"
# Prevent piping web content directly to shell (e.g., curl ... | sh)
commandRegex = "(curl|wget).*\\|\\s*(sh|bash|zsh|sudo)"
decision = "deny"
priority = 1000
denyMessage = "Executing unverified web content directly in a shell is prohibited."

[[rule]]
toolName = "run_shell_command"
# Request confirmation for system power state changes
commandPrefix = ["reboot", "shutdown", "poweroff", "halt", "init 0", "init 6"]
decision = "ask_user"
priority = 900
denyMessage = "System power state changes require manual confirmation."

[[rule]]
toolName = "run_shell_command"
# Guard against accidental overwriting of device files via redirection
commandRegex = ">\\s*/dev/(sd[a-z]|nvme[0-9]n[0-9]|mapper/)"
decision = "deny"
priority = 1000
denyMessage = "Direct redirection to block devices is prohibited."

[[rule]]
toolName = "run_shell_command"
# Guard against destructive git actions
commandRegex = "git\\s+push.*-f"
decision = "ask_user"
priority = 900
denyMessage = "Force pushing to a git repository requires manual confirmation."

[[rule]]
toolName = "run_shell_command"
# ENFORCE HUMAN APPROVAL FOR GSS
# This ensures the CLI itself will prompt the user, regardless of agent intent.
commandPrefix = ["gss push", "gss pr", "gss sync"]
decision = "ask_user"
priority = 1000
denyMessage = "Git synchronization via gss requires explicit user confirmation."
