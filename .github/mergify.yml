# Mergify merge queue — the queue GitHub reserves for org-owned repos,
# provided by the Mergify app instead (installed on this personal-account
# repo; free tier). Docs: https://docs.mergify.com/merge-queue/
#
# How to land a PR through the queue:
#   - add the `ready-for-merge` label (it ALSO force-runs the heavy
#     build-and-validate job on drafts — same label, one meaning: "land it"),
#     then mark the PR ready for review; or
#   - comment `@mergifyio queue` on the PR (works ad hoc, no label).
#
# Mergify updates the PR in place against the latest main (update_method:
# merge — satisfies the ruleset's strict up-to-date requirement without
# force-pushing the branch), waits for the ruleset's REQUIRED checks on the
# updated code, then squash-merges. Queue entries are serialized, so two
# green-but-conflicting PRs can never land stale.

# In-place checks only (no speculative draft-PR trains): required for
# compatibility with the ruleset's strict "require branches to be up to date"
# policy — Mergify flags the combination otherwise (see PR #204's warning).
# Serialized in-place checking is our intended design anyway.
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1
    merge_method: squash
    update_method: merge
    # No queue/merge conditions: the branch ruleset's required status checks
    # are enforced by GitHub and honored by Mergify automatically. Keeping
    # both unset (identical) is also required for in-place mode.

pull_request_rules:
  - name: queue PRs labeled ready-for-merge
    conditions:
      - label = ready-for-merge
      - -draft
    actions:
      queue:
        name: default

  # Label hygiene: when Mergify performs the merge, swap the trigger label
  # for an audit label so merged PRs are scannable at a glance.
  - name: label swap after a Mergify merge
    conditions:
      - merged
      - merged-by = mergify[bot]
    actions:
      label:
        remove: [ready-for-merge]
        add: [merged-by-mergify]
