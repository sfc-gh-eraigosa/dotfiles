name: SDK release tags

# Cuts the per-module release tags Go needs for sub-directory modules: each
# sdk/<tool> is tagged `sdk/<tool>/v<X.Y.Z>` so consumers can pin
# `go install github.com/sfc-gh-eraigosa/dotfiles/sdk/<tool>@sdk/<tool>/v<X.Y.Z>`.
# The version is computed from conventional-commit subjects since the module's
# last tag by the tested helper opt/scripts/system/bump-sdk-version.sh --plan.
#
# THE TAG IS THE ONLY ARTIFACT. This workflow makes no commit and never writes
# to a branch.
#
# History — why it used to fail: until 2026-08 this job also wrote a
# sdk/<tool>/VERSION file and pushed that commit to `main`. The `main` ruleset
# (id 20600414, target: branch) requires a pull request plus 8 status checks, so
# every push was rejected:
#     remote: error: GH013: Repository rule violations found for refs/heads/main.
#     remote: - Changes must be made through a pull request.
# The job therefore failed 14 out of 14 runs from 2026-06-08 to 2026-08-18 and
# never once succeeded, so no module was ever released automatically. Tag pushes
# were never blocked — that ruleset does not target tags — which the old
# tag-sdk-modules.yml proved by pushing tags with this same GITHUB_TOKEN across
# 5/5 green runs. Publishing only the tag removes the protected-branch write and
# the duplicate source of truth in one move. (That workflow is now retired; this
# one subsumes it.)
#
# Recursion cannot occur: no commit is produced, so nothing re-triggers the
# push event. The plan is also self-limiting — once a tag exists, the helper
# sees no commits after it and plans nothing.
#
# Tags are ANNOTATED but UNSIGNED — CI signing and an `sdk/<tool>/v*`
# tag-protection ruleset remain Phase-0 follow-ups (see
# docs/mbo/plans/2026-06-04-sdk-migration-plan.md, D4).

on:
  push:
    branches: [ main ]
    paths:
      - 'sdk/**/*.go'
      - 'sdk/**/go.mod'
      - 'sdk/**/go.sum'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sdk-release-tags
  cancel-in-progress: false

jobs:
  release-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute the release plan and cut tags
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # `--plan` emits `<tool>\t<version>\t<level>`; empty means nothing to
          # release. It always exits 0, so `set -e` stays meaningful for real
          # errors below.
          plan="$(bash opt/scripts/system/bump-sdk-version.sh --plan)"

          if [ -z "$plan" ]; then
            echo "No module has source changes since its last release tag — nothing to release."
            exit 0
          fi

          echo "Release plan:"
          printf '%s\n' "$plan" | sed 's/^/  /'

          created=0
          skipped=0
          while IFS=$'\t' read -r tool ver level; do
            [ -n "$tool" ] || continue
            tag="sdk/${tool}/v${ver}"

            # Idempotent: never move an existing tag. A tag that already exists
            # means this release was already published (e.g. a re-run).
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "exists, skipping: ${tag}"
              skipped=$((skipped + 1))
              continue
            fi

            echo "creating: ${tag} (${level})"
            git tag -a "${tag}" -m "Release ${tool} v${ver} (${level})"
            git push origin "refs/tags/${tag}"
            created=$((created + 1))
          done <<< "$plan"

          echo "tags created: ${created}, already present: ${skipped}"
