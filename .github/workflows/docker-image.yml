name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (go + shell + markdown)
    runs-on: ubuntu-latest
    # Phase 1 of CI hygiene (issue #46). This job MUST gate unit-tests so
    # a lint regression short-circuits the rest of CI. Tool versions are
    # pinned in .ci-baseline-issues.md; bump them in a dedicated PR
    # (Phase 5 of issue #46) so reviewers can see the version delta.
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'
          cache-dependency-path: "src/**/*.sum"

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.0.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.1

      - name: Run make lint
        run: make lint

  unit-tests:
    name: Run Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'
          cache-dependency-path: "src/**/*.sum"
      - name: Run Go Unit Tests
        run: make unit-test
      - name: Upload coverage report
        # Phase 3 of CI hygiene (issue #46). scripts/test.sh emits per-module
        # `<mod>.out` profiles + `<mod>.html` HTML reports into coverage/.
        # `if: always()` so the artifact is still uploaded when the coverage
        # gate (the previous step) FAILS — that's exactly when reviewers want
        # to inspect which package is dragging the module under its floor.
        # actions/upload-artifact is pinned at v3 to match the rest of the
        # workflow; the v4 bump is intentionally deferred to Phase 5.
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - name: gss dependency + license gate
        run: |
          go install github.com/google/go-licenses@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          GSS_STRICT_CHECK=1 bash src/gss/scripts/check-deps.sh

  shell-tests:
    name: Run Shell Test Drivers
    needs: lint
    runs-on: ubuntu-latest
    # Phase 2 of CI hygiene (issue #46). Runs every `*_test.sh` driver
    # discovered by `make shell-test` — install_test.sh, the migrated
    # aliases_test.sh, the safety_guard hook test suite, plus the new
    # drivers for sync-skills, google-cli-setup, open-url, pkg-install.
    # Parallel to unit-tests (Go) so a shell-driver regression doesn't
    # gate the Go suite and vice-versa. Action versions match the rest
    # of this file; bumps are intentionally deferred to Phase 5.
    steps:
      - uses: actions/checkout@v3
      - name: Install jq
        # safety_guard_test.sh builds its tool_input payloads with jq.
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run make shell-test
        run: make shell-test

  build-and-validate:
    name: Build and Integration Test
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dotfiles:latest
    steps:
      - uses: actions/checkout@v3
      - name: Build the Docker image
        run: make build

      - name: Run Integration Tests
        run: make integration-test

      - name: Build Docker in Docker (Legacy Check)
        run: docker run --privileged -v $(pwd):/dotfiles -w /dotfiles dotfiles:latest docker build --tag test opt/docker/helloworld
