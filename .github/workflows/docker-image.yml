name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Run Go Unit Tests
        run: make unit-test

  build-and-validate:
    name: Build and Integration Test
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: dotfiles:latest
    steps:
      - uses: actions/checkout@v3
      - name: Build the Docker image
        run: make build
      
      - name: Run Integration Tests
        run: make integration-test

      - name: Build Docker in Docker (Legacy Check)
        run: docker run --privileged -v $(pwd):/dotfiles -w /dotfiles dotfiles:latest docker build --tag test opt/docker/helloworld
