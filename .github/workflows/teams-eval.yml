name: AI Teams Eval

on:
  # Merge-queue coverage: produces the REQUIRED "Validate teams source +
  # routing artifacts" check, so it must report on the queue's ephemeral
  # branches — merge_group takes no path filters by design.
  merge_group:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'ai/teams/**'
      - 'opt/scripts/system/install_ai_teams.sh'
      - '.github/workflows/teams-eval.yml'
  pull_request:
    paths:
      - 'ai/teams/**'
      - 'opt/scripts/system/install_ai_teams.sh'
      - '.github/workflows/teams-eval.yml'

# Cancel superseded runs on the same ref so only the latest commit is evaluated.
concurrency:
  group: teams-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate teams source + routing artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install yq (mikefarah)
        run: |
          bash opt/scripts/system/install_yq.sh
          echo "${HOME}/opt/bin" >> "${GITHUB_PATH}"

      - name: Validate teams source
        run: bash ai/teams/validate.sh

      - name: Installer test
        run: bash opt/scripts/system/install_ai_teams_test.sh

      - name: Eval fixtures resolve (route-eval --check)
        run: bash ai/teams/eval/route-eval.sh --check

      - name: Routing artifacts are up to date
        run: |
          bash ai/teams/gen-index.sh
          git diff --exit-code -- \
            ai/teams/INDEX.md \
            'ai/teams/**/AGENTS.md' \
            ai/claude/commands/team.md \
            ai/skills/team/SKILL.md

