name: Security Scan

# govulncheck + gosec across every Go module (dotfiles#103): neither was
# installed or run anywhere in CI, so known CVEs in the dependency tree and
# common misuse patterns (unchecked os/exec, permissive file modes, ...)
# were invisible between manual security reviews.
#
# STRICT and a merge-queue requirement since security-scan-green (#394):
# the 156-finding gosec backlog was triaged to zero and the scanners are
# built from tools/security at pinned versions, so a finding here is new
# and blocks the PR. The gosec policy (which rules are excluded and why,
# justification-required #nosec) lives in the Makefile `security` target
# and docs/mbo/designs/security-scan-green.md. Rollout followed this
# repo's precedent for `Go Lint (golangci-lint)` (docs/mergify.md): land
# the warn-only job, triage, THEN strict + required — never the reverse.
#
# Lives in its OWN workflow file, not docker-image.yml: that file's
# required jobs are gated against Mergify's queued/dequeued label churn
# (see "MERGIFY QUEUE LIVELOCK" in its `on:` block — PR #264, #243) because
# restarting a REQUIRED check on a labeled/unlabeled event can livelock the
# merge queue. This job isn't required, so it stays on the plain default
# pull_request triggers and never needs that guard.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan (govulncheck + gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          # tools/security pulls gosec's full module graph (~50 modules); key
          # the cache on its go.sum and the scanned modules' go.sums so a run
          # does not re-download everything before the first scan starts.
          cache-dependency-path: |
            tools/security/go.sum
            sdk/*/go.sum

      - name: govulncheck + gosec (per module)
        run: make security
