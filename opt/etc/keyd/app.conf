# Per-application overrides for the macOS-style keyd layout — installed to
# ~/.config/keyd/app.conf by opt/scripts/system/macos-keys-linux.sh and applied by
# the keyd-application-mapper daemon.
#
# DO NOT EDIT THE INSTALLED COPY — edit this file in the repo and re-run the script.
#
# WHY THIS FILE IS NOT OPTIONAL:
# /etc/keyd/default.conf makes Cmd+<key> emit Ctrl+<key> everywhere. In a GUI app
# that is exactly right. In a TERMINAL it is actively dangerous, because several of
# those Ctrl chords are control codes, not editing commands:
#
#   Cmd+C -> Ctrl+C   SIGINT      kills the foreground job instead of copying
#   Cmd+Z -> Ctrl+Z   SIGTSTP     suspends the foreground job
#   Cmd+S -> Ctrl+S   XOFF        FREEZES the terminal (looks like a hang)
#   Cmd+D -> Ctrl+D   EOF         logs the shell out
#   Cmd+A -> Ctrl+A   readline    jumps to start of line instead of select-all
#
# So the terminal sections below either redirect to the terminal's real
# Ctrl+Shift+<key> binding, or make the chord inert. macos-keys-linux.sh REFUSES to
# install the keyd config at all unless the mapper that applies this file is
# verified running — a half-applied setup that turns Cmd+C into SIGINT is worse
# than no setup at all.
#
# Section names are matched with fnmatch against the normalized WM_CLASS
# (lowercased, non-alphanumerics collapsed to "-"), hence the wildcards.

# --- gnome-terminal (the Spark's default) and its Ptyxis successor -------------
[gnome-terminal*]
# copy       (Ctrl+C must stay SIGINT)
cmd.c = C-S-c
# paste
cmd.v = C-S-v
# cut
cmd.x = C-S-x
# select all
cmd.a = C-S-a
# find
cmd.f = C-S-f
# new tab
cmd.t = C-S-t
# new window
cmd.n = C-S-n
# close tab
cmd.w = C-S-w
# would be SIGTSTP
cmd.z = noop
# would be XOFF and freeze the terminal
cmd.s = noop
# would be EOF and log the shell out
cmd.d = noop

[*ptyxis*]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.x = C-S-x
cmd.a = C-S-a
cmd.f = C-S-f
cmd.t = C-S-t
cmd.n = C-S-n
cmd.w = C-S-w
cmd.z = noop
cmd.s = noop
cmd.d = noop

