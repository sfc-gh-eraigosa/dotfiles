# macOS-style keyboard layout for the Linux desktop — installed to /etc/keyd/default.conf
# by opt/scripts/system/macos-keys-linux.sh. The Linux counterpart to the Cmd-key
# mapping that opt/Desktop/Apps/scripts/macos.ahk provides on Windows; the two are
# kept in parity deliberately so one set of muscle memory works on every machine.
#
# DO NOT EDIT THE INSTALLED COPY — edit this file in the repo and re-run the script.
#
# WHY keyd AND NOT gsettings/xmodmap: gsettings only reaches GNOME's own shortcuts
# and gnome-terminal; it cannot make Cmd+C copy inside Firefox, VS Code, Nautilus or
# any Electron app. keyd rewrites events at the evdev layer, below X11/Wayland, so
# every application sees the translated chord. The trade-off is a root daemon that
# grabs the keyboard — see docs/macos-keys.md for the panic sequence and recovery.
#
# WHY Super IS Cmd (and not a positional Alt/Super swap): macos.ahk already uses the
# left Windows key as Cmd on the Windows side. Matching that here means one habit
# across both machines, and it leaves Ctrl untouched so Ctrl+C stays SIGINT.

[ids]
*

[main]

# Super becomes Command. Both sides, because external keyboards vary in which
# Super key they expose.
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# The cmd layer INHERITS the control modifier (the ":C" suffix). That single
# character is what buys the whole "Cmd+<anything> behaves like Ctrl+<anything>"
# surface for free: every key NOT listed below is emitted with control held, so
# Cmd+C/X/V/A/Z/S/F/O/N/P/T/W/R/L and their Shift variants all work with no
# explicit binding. Only the keys where macOS genuinely differs from Linux need
# an entry here.
#
# Per keyd(1): "bindings are not affected by the modifiers of the layer in which
# they are defined" — so `left = home` below emits a BARE Home, not Ctrl+Home.
# And a still-held Shift is applied to the output, so Cmd+Shift+Left produces
# Shift+Home automatically. That is the whole macos.ahk selection block for free.
[cmd:M]

# --- Editing, one line each ------------------------------------------------------
# Every letter maps to its Ctrl equivalent EXCEPT m and h, which are deliberately
# left out so they fall through as a real <Super> chord for GNOME to minimize on.
# Shift variants (Cmd+Shift+Z redo, Cmd+Shift+T reopen tab, ...) come for free.
a = C-a
b = C-b
c = C-c
d = C-d
e = C-e
f = C-f
g = C-g
i = C-i
j = C-j
k = C-k
n = C-n
o = C-o
p = C-p
r = C-r
s = C-s
t = C-t
u = C-u
v = C-v
w = C-w
x = C-x
y = C-y
z = C-z
slash = C-slash

# --- Deliberately NOT mapped, so GNOME sees a real held <Super> chord ------------
# tab   -> application switcher (needs Super HELD to cycle -- the reason for :M)
# space -> Activities search (Spotlight)
# m, h  -> minimize / hide
# l     -> LOCK SCREEN. macos.ahk uses Cmd+L for the address bar, but locking the
#          machine is worth more than a browser shortcut, so this one deliberately
#          departs from Windows parity. Ctrl+L still focuses the address bar.

# --- Quit ------------------------------------------------------------------------
# Alt+F4 is honoured by every toolkit; Ctrl+Q is GTK-only and wrong in Electron.
q = A-f4

# --- Line & document navigation --------------------------------------------------
left  = home
right = end
up    = C-home
down  = C-end

# Cmd+Delete deletes to the start of the line (macos.ahk sends +{Home}{Del}).
backspace = macro(S-home delete)

# --- Browser history --------------------------------------------------------------
# Cmd+[ / Cmd+] are the real macOS Back/Forward, and worth binding because the
# [alt] block below takes Alt+Left away from Firefox's Back.
leftbrace  = A-left
rightbrace = A-right

# --- Tab selection ----------------------------------------------------------------
# macos.ahk sends Ctrl+N on Windows, but Linux browsers and editors use Alt+N.
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9

# --- Option+Delete deletes the previous word --------------------------------------
# Extending the built-in [alt] layer is legal -- keyd sums repeated layer headings.
#
# NOTE: macos.ahk also maps Opt+Left/Right to word navigation on Windows. It is
# deliberately NOT done here: on Linux that would take Alt+Left/Right away from the
# browser's Back/Forward, which is a worse trade than losing the shortcut. Word
# navigation is still available on its native Ctrl+arrows, and Cmd+[ / Cmd+] give
# Back/Forward on the keys macOS actually uses.
[alt]
backspace = C-backspace

# --- Window tiling and lock (Cmd+Option+...) --------------------------------------
# Cmd+arrows are Home/End above, which takes GNOME's <Super>+arrow tiling away.
# This composite layer (active only when BOTH cmd and alt are held) gives it a
# new home.
#
# NEVER EMIT `M-<key>` FROM THIS LAYER. It looks like the obvious way to hand the
# chord back to GNOME, and it CRASHES keyd: the emitted Meta re-enters the
# Meta-triggered [cmd:M] layer, which emits Meta again, and keyd recurses until it
# dies. Observed with keyd v2.6.0 on 2026-08-31 -- SIGSEGV with a 147MB memory
# peak, eleven seconds after loading such a config. Emit a plain Ctrl+Alt chord
# instead and point GNOME at it with gsettings (gnome-desktop-defaults.sh does).
[cmd+alt]
left  = C-A-left
right = C-A-right
up    = C-A-up
down  = C-A-down
