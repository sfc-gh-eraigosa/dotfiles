# --- Tmux Configuration ---

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copy to system clipboard (cross-platform support)
if-shell 'test "$(uname)" = "Darwin"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"; \
   bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"'

if-shell 'test "$(uname)" = "Linux"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -i -b"; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -i -b"; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel -i -b"; \
   bind p run "xsel -o -b | tmux load-buffer - && tmux paste-buffer"'

# Enable mouse mode (pane selection, window selection, resizing, scrolling)
set -g mouse on

# Allow mouse to select panes explicitly
bind-key -n MouseDown1Pane select-pane -t =

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
bind-key -n 'C-h' select-pane -L
bind-key -n 'C-j' select-pane -D
bind-key -n 'C-k' select-pane -U
bind-key -n 'C-l' select-pane -R
